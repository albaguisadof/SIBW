{% extends "base.html" %}
    {% block titulo %}
       Listado usuarios
    {% endblock %}
    {% block principal %}
    <h3>Listado de usuarios</h3>
        {% for usuario in usuarios %}
        <form action="listadoUsuarios.php" method="post">
            <input type="hidden" name="id" value="{{ usuario.nombre }}">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}">
          
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" value="{{ usuario.correo }}">
          
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" value="{{ usuario.passwd }}">
          
            <label for="tipo">Rol:</label>
            <select id="tipo" name="tipo">
                <option value="registrado" {% if usuario.tipo == "registrado" %} selected {% endif %}>registrado</option>
                <option value="moderador" {% if usuario.tipo == "moderador" %} selected {% endif %}>moderador</option>
                <option value="gestor" {% if usuario.tipo == "gestor" %} selected {% endif %}>gestor</option>
                <option value="super" {% if usuario.tipo == "super" %} selected {% endif %}>super</option>
            </select>

            <input type="submit" value="Modificar">
          </form> 
        {% endfor %}     
  {% endblock %}
